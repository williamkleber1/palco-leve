plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wk.palcoleve'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wk.palcoleve'
        minSdk 26
        targetSdk 29
        versionCode 1
        versionName '0.1.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3 -ffast-math'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

